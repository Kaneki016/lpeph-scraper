[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lpeph-scraper"
version = "0.1.0"
description = "Scrape the LPPEH (Malaysia) estate agent / valuer firm registry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lpeph-scraper = "lpeph_scraper.cli:main"

[tool.setuptools]
packages = ["lpeph_scraper"]
